[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sum-indexer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sum-contracts", "sum-storage", "sum-database", "fastapi>=0.128,<1", "uvicorn>=0.40,<1", "inngest==0.5.14", "httpx>=0.28,<1", "pymupdf>=1.26,<2", "tokenizers>=0.22,<0.24", "huggingface-hub>=0.34,<2"]

[project.optional-dependencies]
local-model = ["sentence-transformers>=5,<6"]

[tool.uv.sources]
sum-contracts = { workspace = true }
sum-storage = { workspace = true }
sum-database = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
