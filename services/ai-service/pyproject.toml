[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sum-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sum-contracts",
  "sum-database",
  "pgvector>=0.4,<1",
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
  "httpx>=0.28,<1",
  "inngest==0.5.14",
  "redis>=6,<8",
  "langchain>=1.0,<2",
  "langsmith>=0.4,<1",
  "langchain-litellm>=0.6,<1",
  "litellm>=1.83.3,<2",
]

[tool.uv.sources]
sum-contracts = { workspace = true }
sum-database = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
