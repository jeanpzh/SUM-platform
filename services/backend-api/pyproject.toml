[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sum-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sum-contracts", "sum-storage", "sum-database", "fastapi>=0.128,<1", "uvicorn>=0.40,<1", "python-multipart>=0.0.22,<1", "httpx>=0.28,<1", "cryptography>=46,<49"]

[project.scripts]
sum-dispatcher = "sum_backend.outbox:main"

[tool.uv.sources]
sum-contracts = { workspace = true }
sum-storage = { workspace = true }
sum-database = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
