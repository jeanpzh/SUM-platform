[project]
name = "sum-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sum-backend", "sum-indexer", "sum-database", "sum-ai"]

[tool.uv.workspace]
members = ["packages/contracts", "packages/storage", "packages/database", "services/backend-api", "services/indexer-service", "services/ai-service"]

[tool.uv.sources]
sum-backend = { workspace = true }
sum-indexer = { workspace = true }
sum-database = { workspace = true }
sum-ai = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/contracts/src", "packages/storage/src", "services/backend-api/src", "services/indexer-service/src", "services/ai-service/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
