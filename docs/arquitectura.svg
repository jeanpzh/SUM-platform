<path d="M760 113C760 96 900 96 900 113V166C900 183 760 183 760 166Z" fill="#e6f4e9" stroke="#86b393"/><ellipse cx="830" cy="113" rx="70" ry="12" fill="#d9eedf" stroke="#86b393"/><text x="830" y="142" text-anchor="middle" class="head">Base institucional</text><text x="830" y="159" text-anchor="middle" class="sub">Fuentes + metadatos</text><text x="830" y="175" text-anchor="middle" class="sub">Vectores publicados</text>
