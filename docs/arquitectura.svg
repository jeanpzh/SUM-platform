<text x="40" y="63" class="sub">Flujos independientes de ingesta y consulta · Integración SUM reemplazable</text>
<text x="40" y="90" class="sub">CONOCIMIENTO INSTITUCIONAL / ASÍNCRONO</text>
<text x="40" y="260" class="sub">CONSULTA ESTUDIANTIL / INTERACTIVA</text>
