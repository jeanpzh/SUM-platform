<svg xmlns="http://www.w3.org/2000/svg" lang="es" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
<title id="title">FISI / UNMSM — Arquitectura del asistente académico MVP</title><desc id="desc">La ingesta administrativa se procesa en cola mediante trabajadores independientes y se publica en una base de conocimiento institucional. Los estudiantes consultan el backend y la API de IA, que recupera evidencia institucional y solicita datos académicos mínimos a través de una pasarela SUM. Playwright local es el adaptador del MVP; una API autorizada podría reemplazarlo en el futuro.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243246;font-size:14px}.head{font-weight:700;font-size:16px}.sub{font-size:12px;fill:#526176}.edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.future{stroke-dasharray:6 5}.label{font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}</style>
