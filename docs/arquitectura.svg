<g class="label"><text x="130" y="226">Gestionar fuentes</text><text x="310" y="121">Encolar</text><text x="544" y="120">Tareas</text><text x="723" y="120">Publicar</text><text x="600" y="201">Recuperar evidencia</text><text x="580" y="310">Datos académicos necesarios</text><text x="901" y="274">Contrato estable</text><text x="1120" y="310">JSON de la sesión</text><text x="842" y="431">Mismo contrato</text><text x="1150" y="431">Integración futura</text></g>
<path d="M40 505H1440" stroke="#dbe2ea"/>
<text x="40" y="534" class="head">Cuatro límites de ejecución</text><text x="40" y="558">API backend · API de IA · Pasarela SUM · Indexadores</text>
<text x="40" y="584" class="sub">El estudiante inicia sesión en el navegador local de Playwright. No se guardan contraseñas ni sesiones. Las instantáneas no ingresan a la base institucional compartida.</text>
<text x="40" y="610" class="sub">Línea continua = MVP · Discontinua = reemplazo futuro · Orientación basada en evidencia, no una decisión administrativa oficial</text>
</svg>
