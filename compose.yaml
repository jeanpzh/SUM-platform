name: sum-indexing

x-service-environment: &service-environment
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Copy .env.example to .env}
  STORAGE_DRIVER: s3
  S3_ENDPOINT_URL: http://storage:9000
  S3_BUCKET: sum-documents
  AWS_DEFAULT_REGION: us-east-1

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: sum
      POSTGRES_DB: sum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:?}
      RETRIEVAL_DB_PASSWORD: ${RETRIEVAL_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sum -d sum"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    build:
      context: .
      dockerfile: infra/Dockerfile.storage
      target: minio
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - object-data:/data

  storage-init:
    build:
      context: .
      dockerfile: infra/Dockerfile.storage
      target: mc
      args:
        MINIO_CLIENT_VERSION: ${MINIO_CLIENT_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    entrypoint: ["/bin/sh", "/initialize.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BACKEND_S3_SECRET: ${BACKEND_S3_SECRET:?}
      INDEXER_S3_SECRET: ${INDEXER_S3_SECRET:?}
    volumes:
      - ./infra/storage/initialize.sh:/initialize.sh:ro
      - ./infra/storage:/policies:ro
    depends_on:
      storage: {condition: service_started}

  backend:
    build: {context: ., dockerfile: infra/Dockerfile.backend}
    environment:
      <<: *service-environment
      DATABASE_URL: postgresql://sum_backend:${BACKEND_DB_PASSWORD:?}@postgres:5432/sum
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:?}
      AI_IDENTITY_SECRET: ${AI_IDENTITY_SECRET:?}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:-}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal,ollama}
      AI_SERVICE_URL: http://ai:8002
      STUDENT_AI_PROVIDER: ${STUDENT_AI_PROVIDER:-ollama}
      STUDENT_AI_MODEL: ${STUDENT_AI_MODEL:-llama3.2}
      AI_EVALUATION_DIR: /app/data/ai-evaluation
      ENV_MODE: ${ENV_MODE:-PRODUCTION}
      EMBEDDING_DRIVER: ${EMBEDDING_DRIVER:-tei}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-d13f1b27baf31030b7fd040960d60d909913633f}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}
      AWS_ACCESS_KEY_ID: sum-backend
      AWS_SECRET_ACCESS_KEY: ${BACKEND_S3_SECRET:?}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-33554432}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-1000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data/ai-evaluation:/app/data/ai-evaluation:ro
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  dispatcher:
    build: {context: ., dockerfile: infra/Dockerfile.backend}
    command: ["sum-dispatcher"]
    environment:
      DATABASE_URL: postgresql://sum_backend:${BACKEND_DB_PASSWORD:?}@postgres:5432/sum
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:?}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?}
      AI_IDENTITY_SECRET: ${AI_IDENTITY_SECRET:?}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:-}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal,ollama}
      INNGEST_EVENT_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: local
    depends_on:
      backend: {condition: service_healthy}
      inngest: {condition: service_started}

  indexer:
    build: {context: ., dockerfile: infra/Dockerfile.indexer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *service-environment
      DATABASE_URL: postgresql://sum_indexer:${INDEXER_DB_PASSWORD:?}@postgres:5432/sum
      BACKEND_URL: http://backend:8000
      AWS_ACCESS_KEY_ID: sum-indexer
      AWS_SECRET_ACCESS_KEY: ${INDEXER_S3_SECRET:?}
      INNGEST_DEV: "1"
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
      CPU_PROCESSES: ${CPU_PROCESSES:-2}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-2}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-2}
      WRITING_CONCURRENCY: ${WRITING_CONCURRENCY:-2}
      PAGE_BATCH_SIZE: ${PAGE_BATCH_SIZE:-10}
      MAX_PAGES: ${MAX_PAGES:-2000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      CHUNK_TOKENS: ${CHUNK_TOKENS:-380}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      STAGE_TIMEOUT_SECONDS: ${STAGE_TIMEOUT_SECONDS:-900}
      EMBEDDING_DRIVER: ${EMBEDDING_DRIVER:-tei}
      EMBEDDING_URL: http://embeddings:80
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_TOKENIZER_MODEL: ${EMBEDDING_TOKENIZER_MODEL:-intfloat/multilingual-e5-base}
      EMBEDDING_TOKENIZER_REVISION: ${EMBEDDING_TOKENIZER_REVISION:-d13f1b27baf31030b7fd040960d60d909913633f}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-d13f1b27baf31030b7fd040960d60d909913633f}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}
    cpus: 2
    mem_limit: 2g
    volumes:
      - tokenizer-cache:/tmp/huggingface
    depends_on:
      backend: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: {context: ., dockerfile: infra/Dockerfile.ai, target: runtime}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://sum_retrieval:${RETRIEVAL_DB_PASSWORD:?}@postgres:5432/sum
      BACKEND_URL: http://backend:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?}
      REDIS_URL: redis://redis:6379/0
      STUDENT_REQUESTS_PER_MINUTE: ${STUDENT_REQUESTS_PER_MINUTE:-5}
      STUDENT_REQUESTS_PER_DAY: ${STUDENT_REQUESTS_PER_DAY:-50}
      STUDENT_TOKENS_PER_MINUTE: ${STUDENT_TOKENS_PER_MINUTE:-20000}
      STUDENT_TOKENS_PER_DAY: ${STUDENT_TOKENS_PER_DAY:-100000}
      ACADEMIC_GATEWAY_URL: ${ACADEMIC_GATEWAY_URL:-}
      STUDENT_RULES_FILE: ${STUDENT_RULES_FILE:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-sum-student}
      LANGSMITH_ADMIN_PROJECT: ${LANGSMITH_ADMIN_PROJECT:-sum-admin-rag}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_ADMIN_CAPTURE_CONTENT: ${LANGSMITH_ADMIN_CAPTURE_CONTENT:-false}
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      EMBEDDING_URL: http://embeddings:80
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CUSTOM_AI_URL: ${CUSTOM_AI_URL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      AI_EMBEDDING_INPUT_USD_PER_MILLION: ${AI_EMBEDDING_INPUT_USD_PER_MILLION:-}
      AI_EMBEDDING_PRICING_DATE: ${AI_EMBEDDING_PRICING_DATE:-2026-10-03}
      AI_MODELS_JSON: ${AI_MODELS_JSON:-[{"provider":"ollama","model":"llama3.2","input_usd_per_million":0,"output_usd_per_million":0,"pricing_date":"2026-10-03"}]}
      INNGEST_DEV: "1"
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
    volumes:
      - ./data/student-rules:/app/data/student-rules:ro
    depends_on:
      backend: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai-test:
    profiles: ["test"]
    build: {context: ., dockerfile: infra/Dockerfile.ai, target: test}
    environment:
      PYTHONPATH: /app
      TEST_DATABASE_URL: postgresql://sum:${POSTGRES_PASSWORD:?}@postgres:5432/sum
      DATABASE_URL: postgresql://sum_backend:${BACKEND_DB_PASSWORD:?}@postgres:5432/sum
      RETRIEVAL_DATABASE_URL: postgresql://sum_retrieval:${RETRIEVAL_DB_PASSWORD:?}@postgres:5432/sum
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./tests:/app/tests:ro
      - ./data/ai-evaluation:/app/data/ai-evaluation:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}", "--revision", "${EMBEDDING_REVISION:-d13f1b27baf31030b7fd040960d60d909913633f}", "--max-client-batch-size", "${EMBEDDING_BATCH_SIZE:-32}"]
    volumes:
      - model-cache:/data
    cpus: 2
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 30

  inngest:
    image: ${INNGEST_IMAGE:-inngest/inngest:latest}
    command: ["inngest", "dev", "-u", "http://indexer:8001/api/inngest", "-u", "http://ai:8002/api/inngest"]
    ports: ["127.0.0.1:8288:8288"]
    depends_on:
      indexer: {condition: service_healthy}
      ai: {condition: service_healthy}

volumes:
  postgres-data:
  object-data:
  model-cache:
  tokenizer-cache:
